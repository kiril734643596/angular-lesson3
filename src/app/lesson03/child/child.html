<h1>lesson 3!</h1>
<h1>user:{{userName}}</h1>
<div class="header">
    <input type="text" class="inputSearch" [(ngModel)]="task">
    <button class="buttonAdd" (click)="addButton()">Add</button>
</div>
<div class="tableBox">
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Task</th>
                <th>chek</th>
                <th>Done/in Progress</th>
                <th>Edit</th>
                <th>delete</th>
            </tr>
        </thead>
        <tbody>
            @for (item of taskArr; track $index; let i = $index) {
            <tr>
                <td>{{ i + 1 }}</td>
                <td>{{ item.title }}</td>
                <td>
                    <input type="checkbox" [(ngModel)]="item.done">
                </td>
                @if(item.done){
                <td [style.color]="'green'">Done</td>
                }
                @else {
                <td [style.color]="'red'">in Progress</td>
                }
                <td>
                    <button class="editButton" (click)="editButton(i)">edit</button>
                </td>
                <td>
                    <button class="deleteButton" (click)="deleteButton(i)" [disabled]="!taskArr[i].done"
                        [class]="taskArr[i].done ? 'ok' : 'no'  " [disabled]="erorSave">delete</button>
                </td>
            </tr>
            @if(editCheck){
            <div class="editAbsolute">
                <input type="text" class="inputCheck" [(ngModel)]="editText">
                <button class="save" (click)="save(i)">save</button>
            </div>
            }
            }
        </tbody>
    </table>
</div>
